<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Received</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.celebration {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
}

h1 {
  font-size: clamp(38px, 10vw, 80px);
  margin: 15px 0;
  font-weight: 800;
  position: relative;
  z-index: 2;
}

p {
  font-size: 20px;
  max-width: 650px;
  line-height: 1.5;
  position: relative;
  z-index: 2;
}

.confetti {
  position: absolute;
  top: -50px;
  font-size: 28px;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  from {
    transform: translateY(-50px) rotate(0deg);
  }
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}

.confetti:nth-child(1) { left: 5%; animation-delay: 0s; }
.confetti:nth-child(2) { left: 15%; animation-delay: .7s; }
.confetti:nth-child(3) { left: 25%; animation-delay: 1.4s; }
.confetti:nth-child(4) { left: 35%; animation-delay: .3s; }
.confetti:nth-child(5) { left: 45%; animation-delay: 1.1s; }
.confetti:nth-child(6) { left: 55%; animation-delay: 2s; }
.confetti:nth-child(7) { left: 65%; animation-delay: .5s; }
.confetti:nth-child(8) { left: 75%; animation-delay: 1.7s; }
.confetti:nth-child(9) { left: 85%; animation-delay: .9s; }
.confetti:nth-child(10) { left: 95%; animation-delay: 2.3s; }
</style>
</head>

<body>

<div class="celebration">

  <div class="confetti">🎉</div>
  <div class="confetti">🌸</div>
  <div class="confetti">🎊</div>
  <div class="confetti">🌼</div>
  <div class="confetti">🌺</div>
  <div class="confetti">🎉</div>
  <div class="confetti">🌸</div>
  <div class="confetti">🎊</div>
  <div class="confetti">🌼</div>
  <div class="confetti">🌺</div>

  <div style="font-size:70px;position:relative;z-index:2;">
    🎉🌸🎊
  </div>

  <h1>CONGRATULATIONS!</h1>

  <p><strong>Your application has been successfully submitted.</strong></p>

  <p>Your details have been received for processing.</p>

  <div style="font-size:55px;position:relative;z-index:2;">
    🌷🌼🌺
  </div>

</div>

</body>
</html>
