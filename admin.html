<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title>
<style>body{font-family:Arial;margin:0;background:#f4f7f9;color:#17212b}header{background:#082b63;color:#fff;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1200px;margin:20px auto;padding:0 15px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 15px #0001;margin-bottom:18px}input,select{padding:10px;border:1px solid #ccd5dd;border-radius:7px}button{padding:10px 15px;border:0;border-radius:7px;background:#0b7a45;color:#fff;font-weight:bold}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e3e7eb;text-align:left}th{background:#eef2f5}.scroll{overflow:auto}@media(max-width:700px){table{min-width:900px}}</style></head>
<body><header><b>Mutale Empowerment — Admin</b><div><button onclick="location.href='/index.html'">Public Portal</button> <button onclick="logout()">Logout</button></div></header>
<div class="wrap"><div id="login" class="card"><h2>Admin Login</h2><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Sign in</button></div>
<div id="dash" class="hidden"><div class="card"><button onclick="location.href='/api/admin/export.csv'">Export CSV</button> <button onclick="loadApps()">Refresh</button><span id="count"></span></div>
<div class="card scroll"><table><thead><tr><th>Reference</th><th>Name</th><th>Phone</th><th>NRC</th><th>District</th><th>Category</th><th>Status</th><th>Submitted</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});if(!r.ok)return alert("Invalid password");showDash()}
async function showDash(){document.getElementById("login").classList.add("hidden");document.getElementById("dash").classList.remove("hidden");loadApps()}
async function loadApps(){let r=await fetch("/api/admin/applications");if(r.status===401)return location.reload();let a=await r.json();document.getElementById("count").textContent="  Applications: "+a.length;document.getElementById("rows").innerHTML=a.map(x=>`<tr><td>${x.reference}</td><td>${esc(x.full_name)}</td><td>${esc(x.phone)}</td><td>${esc(x.nrc)}</td><td>${esc(x.district)}</td><td>${esc(x.category)}</td><td><select onchange="status(${x.id},this.value)">${["Submitted","Under Review","Eligible","Not Eligible","Approved","Rejected"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join("")}
async function status(id,value){await fetch("/api/admin/applications/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:value})})}
async function logout(){await fetch("/api/admin/logout",{method:"POST"});location.reload()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
